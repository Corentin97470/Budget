<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget mensuel</title>
<style>
:root{--bg:#0d0f12;--card:#171a20;--line:#252a33;--tx:#eef1f5;--mu:#8b93a1;--ok:#34d399;--ko:#f87171;--ac:#6366f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
.w{max-width:480px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs button{flex:none;background:var(--card);color:var(--mu);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.row{display:flex;justify-content:space-between;gap:12px}
.lb{font-size:11px;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.big{font-size:30px;font-weight:700;margin-top:4px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;transition:width .3s,background .3s}
.st{font-size:12px;margin-top:8px;color:var(--mu)}
form{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
input{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:13px;font-size:16px;width:100%}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.add{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
li span.n{flex:1;overflow-wrap:anywhere}
li b{font-variant-numeric:tabular-nums}
li button{background:none;border:0;color:var(--mu);font-size:20px;padding:2px 6px}
.empty{color:var(--mu);text-align:center;padding:24px 0;font-size:14px}
</style>
</head>
<body>
<div class="w">
  <div class="tabs" id="tabs"></div>
  <div class="sum">
    <div class="row">
      <div><div class="lb">Total dépensé</div><div class="big" id="tot">0 €</div></div>
      <div style="text-align:right"><div class="lb">Restant sur 500 €</div><div class="big" id="rest">500 €</div></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="st" id="st"></div>
  </div>
  <form id="f">
    <input id="lab" placeholder="Objet / Libellé (ex : Essence)" autocomplete="off" required>
    <input id="amt" placeholder="Montant en €" inputmode="decimal" autocomplete="off" required>
    <button class="add" type="submit">+ Ajouter la dépense</button>
  </form>
  <ul id="list"></ul>
</div>
<script>
var BUDGET=500,KEY="budget-v1";
var MONTHS=["Août","Septembre","Octobre","Novembre","Décembre","Janvier"];
var data={},cur="Septembre";
MONTHS.forEach(function(m){data[m]=[]});
try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(p&&p.data)data=p.data;if(p&&p.cur)cur=p.cur}}catch(e){}
MONTHS.forEach(function(m){if(!data[m])data[m]=[]});
function save(){try{localStorage.setItem(KEY,JSON.stringify({data:data,cur:cur}))}catch(e){}}
function eur(n){return n.toLocaleString("fr-FR",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+" €"}
function esc(t){return t.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var t=document.getElementById("tabs");t.innerHTML="";
  MONTHS.forEach(function(m){var b=document.createElement("button");b.textContent=m;b.className=m===cur?"on":"";b.onclick=function(){cur=m;save();render()};t.appendChild(b)});
  var items=data[cur],total=items.reduce(function(a,x){return a+x.a},0),rest=BUDGET-total,over=rest<0,col=over?"var(--ko)":"var(--ok)";
  document.getElementById("tot").textContent=eur(total);
  var r=document.getElementById("rest");r.textContent=eur(rest);r.style.color=col;
  var bar=document.getElementById("bar");bar.style.width=Math.min(100,total/BUDGET*100)+"%";bar.style.background=col;
  var st=document.getElementById("st");st.style.color=col;
  st.textContent=over?"Dépassement de "+eur(-rest):"Dans le budget ("+Math.round(total/BUDGET*100)+" % utilisé)";
  var l=document.getElementById("list");
  if(!items.length){l.innerHTML='<div class="empty">Aucune dépense pour '+cur+'</div>';return}
  l.innerHTML=items.map(function(x,i){return '<li><span class="n">'+esc(x.l)+'</span><b>'+eur(x.a)+'</b><button aria-label="Supprimer" data-i="'+i+'">✕</button></li>'}).join("");
  l.querySelectorAll("button").forEach(function(b){b.onclick=function(){data[cur].splice(+b.dataset.i,1);save();render()}});
}
document.getElementById("f").onsubmit=function(e){
  e.preventDefault();
  var l=document.getElementById("lab").value.trim(),a=parseFloat(document.getElementById("amt").value.replace(",","."));
  if(!l||isNaN(a)||a<=0)return;
  data[cur].push({l:l,a:a});save();render();
  document.getElementById("lab").value="";document.getElementById("amt").value="";document.getElementById("lab").focus();
};
render();
</script>
</body>
</html>
